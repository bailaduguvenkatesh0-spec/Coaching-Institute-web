<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TEAM B Coaching Institute | AI Automation Platform</title>
    <meta name="description" content="AI Automation Platform for Admissions Intelligence, Counsellor Routing, Student Attendance, and Parent Updates." />
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-900 text-slate-100 antialiased selection:bg-cyan-500 selection:text-white font-sans min-h-screen">
    <div id="root">
      <!-- Fallback shown only if opened directly as a file:// rather than http:// -->
      <script>
        if (window.location.protocol === 'file:') {
          document.addEventListener('DOMContentLoaded', function() {
            var root = document.getElementById('root');
            if (root) {
              root.innerHTML = '<div style="font-family:system-ui,-apple-system,sans-serif;background:#090d16;color:#e2e8f0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;">' +
                '<div style="background:#131c2e;border:1px solid #1e293b;border-radius:16px;max-width:560px;padding:32px;box-shadow:0 20px 40px rgba(0,0,0,0.6);text-align:center;">' +
                '<div style="font-size:40px;margin-bottom:12px;">🚀</div>' +
                '<h2 style="font-size:20px;font-weight:700;color:#38bdf8;margin:0 0 8px;">TEAM B Coaching Institute Platform</h2>' +
                '<p style="color:#94a3b8;font-size:14px;line-height:1.6;margin:0 0 20px;">This single-page React app was opened directly from the filesystem (<code style="background:#0f172a;color:#a5f3fc;padding:2px 6px;border-radius:4px;">file://</code>). Single Page Applications require the local web server.</p>' +
                '<p style="color:#cbd5e1;font-size:13px;margin:0 0 16px;">Please run <code style="background:#0f172a;color:#38bdf8;padding:3px 8px;border-radius:4px;">npm run dev</code> in terminal, then open:</p>' +
                '<div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;">' +
                '<a href="http://localhost:5173" style="display:inline-block;background:#0284c7;color:#fff;text-decoration:none;padding:10px 18px;border-radius:8px;font-size:13px;font-weight:600;">Open Web App (:5173) &rarr;</a>' +
                '<a href="http://localhost:4000" style="display:inline-block;background:#334155;color:#fff;text-decoration:none;padding:10px 18px;border-radius:8px;font-size:13px;font-weight:600;">Open API Server (:4000) &rarr;</a>' +
                '</div>' +
                '</div></div>';
            }
          });
        }
      </script>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
