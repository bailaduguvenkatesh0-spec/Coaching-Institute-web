version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: teamb_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-teamb_db}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: teamb_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-teamb_db}?schema=public
      JWT_SECRET: ${JWT_SECRET:-replace-with-a-secure-random-secret-at-least-32-chars-long}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Kolkata}
      N8N_SHARED_WEBHOOK_SECRET: ${N8N_SHARED_WEBHOOK_SECRET:-demo-secret}
    ports:
      - "${API_PORT:-4000}:4000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: teamb_web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "5173:80"

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: teamb_n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=${APP_TIMEZONE:-Asia/Kolkata}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:-demo-encryption-key-team-b-32ch}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/data/workflows

volumes:
  postgres_data:
  n8n_data:
